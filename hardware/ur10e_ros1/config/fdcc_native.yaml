fdcc_shared:
  type: position_controllers/CartesianComplianceController
  end_effector_link: knife_control
  robot_base_link: base_link
  ft_sensor_ref_link: ati_sensing_frame
  compliance_ref_link: knife_compliance
  target_frame_topic: target_frame
  joints:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - elbow_joint
  - wrist_1_joint
  - wrist_2_joint
  - wrist_3_joint
  stiffness:
    trans_x: 5000.0
    trans_y: 2000.0
    trans_z: 2000.0
    rot_x: 80.0
    rot_y: 40.0
    rot_z: 80.0
    use_parallel_force_position_control: true
    sel_x: 1.0
    sel_y: 1.0
    sel_z: 0.5
    sel_ax: 1.0
    sel_ay: 0.5
    sel_az: 1.0
  solver:
    error_scale: 0.0168
    iterations: 1
    forward_dynamics:
      link_mass: 0.1
    publish_state_feedback: false
  pd_gains:
    trans_x:
      p: 0.2
      d: 0.0
    trans_y:
      p: 0.2
      d: 0.0
    trans_z:
      p: 0.05
      d: 0.0
    rot_x:
      p: 2.0
      d: 0.0
    rot_y:
      p: 0.2
      d: 0.0
    rot_z:
      p: 2.0
      d: 0.0
  force:
    hand_frame_control: false
  gravity:
    x: 0.0
    y: 0.0
    z: -9.8
  tool:
    mass: 0.0
    com_x: 0.0
    com_y: 0.0
    com_z: 0.0
